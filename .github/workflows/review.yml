name: Forge PR review (reusable)

# Consumers do NOT copy this file. They add a thin wrapper
# `.github/workflows/review.yml` that calls it (see docs/INSTALL.md).
# Read-only by design: the agent reviews and comments, never pushes.
# Posting the comment is the only write, via the caller's gh_token.

on:
  workflow_call:
    inputs:
      model:
        description: "OpenCode model ID"
        required: false
        default: "opencode/muse-spark-1.3-contributor-free"
        type: string
      standards_file:
        description: "Reviewer standards file in the consumer repo"
        required: false
        default: ".sandcastle/CODING_STANDARDS.md"
        type: string
      prompt_file:
        description: "Review prompt (vendored with the runner)"
        required: false
        default: ".forge/prompts/pr-review-prompt.md"
        type: string
      node_version:
        description: "Node version for the runner (review itself needs Node; your repo can be any stack)"
        required: false
        default: "24"
        type: string
      opencode_version:
        description: "Pinned opencode-ai CLI version (never floats; bump deliberately)"
        required: false
        default: "1.18.34"
        type: string
    secrets:
      opencode_api_key:
        description: "OpenCode API key for the review run"
        required: true
      gh_token:
        description: "GitHub token (used only to read the PR and post the review comment — GITHUB_TOKEN suffices)"
        required: true

jobs:
  review:
    name: review (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENCODE_API_KEY: ${{ secrets.opencode_api_key }}
      # Deliberately NO GH_TOKEN here: the agent must not call the GitHub
      # API (prompt-injection via PR title/body/diff stays inert).
      # Same trust posture as the factory: full tool approval, but this
      # workflow has no push/delivery step, so a misbehaving run can only
      # waste minutes, never land code.
      OPENCODE_PERMISSION: '{"*": "allow"}'
      FORGE_MODEL: ${{ inputs.model }}
      REVIEW_STANDARDS: ${{ inputs.standards_file }}
      REVIEW_PROMPT: ${{ inputs.prompt_file }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.gh_token }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install OpenCode CLI (pinned)
        run: npm install -g opencode-ai@${{ inputs.opencode_version }}

      - name: Build review context
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")"
          {
            echo "# PR #${PR_NUMBER} context"
            echo
            gh pr view "$PR_NUMBER" --json title,body,baseRefName,headRefName,url \
              --jq '"## " + .title + "\n\n" + .url + " (" + .headRefName + " → " + .baseRefName + ")\n\n### Body\n\n" + (.body // "(empty)")'
            echo
            echo "### Diffstat (base $BASE_SHA → head $HEAD_SHA)"
            echo
            echo '```'
            git diff --stat "$BASE_SHA" "$HEAD_SHA"
            echo '```'
          } > .forge-review-context.md
          echo "REVIEW_BASE=$BASE_SHA" >> "$GITHUB_ENV"
          echo "REVIEW_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "REVIEW_CONTEXT=$PWD/.forge-review-context.md" >> "$GITHUB_ENV"
          echo "REVIEW_OUTPUT=$PWD/.forge-review.md" >> "$GITHUB_ENV"
          mkdir -p .forge-review
          # Resolve a repo-relative file to an absolute path the agent can
          # read: prefer the worktree, else materialize from HEAD (robust
          # against partial/sparse checkouts), else fail with diagnostics.
          resolve() {
            local rel="$1" dest="$2"
            if [ -f "$rel" ]; then
              echo "$PWD/$rel"
            elif git cat-file -e "HEAD:$rel" 2>/dev/null; then
              git show "HEAD:$rel" > "$dest"
              echo "$PWD/$dest"
            else
              {
                echo "::error::$rel not in worktree nor in HEAD."
                echo "pwd=$PWD head=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
                git ls-files | head -30
              } >&2
              return 1
            fi
          }
          if out="$(resolve "$REVIEW_STANDARDS" .forge-review/standards.md)"; then
            echo "REVIEW_STANDARDS=$out" >> "$GITHUB_ENV"
          else
            for fallback in AGENTS.md CONTRIBUTING.md; do
              if out="$(resolve "$fallback" .forge-review/standards.md 2>/dev/null)"; then
                echo "REVIEW_STANDARDS=$out" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          grep -q '^REVIEW_STANDARDS=' "$GITHUB_ENV" || {
            echo "::error::no standards file (tried $REVIEW_STANDARDS, AGENTS.md, CONTRIBUTING.md)."
            exit 1
          }
          if out="$(resolve "$REVIEW_PROMPT" .forge-review/prompt.md)"; then
            echo "REVIEW_PROMPT=$out" >> "$GITHUB_ENV"
          else
            echo "::error::prompt $REVIEW_PROMPT missing — re-run bash scripts/sync-forge.sh to re-vendor."
            exit 1
          fi

      - name: Run PR review agent
        run: |
          : "${REVIEW_PROMPT:?review prompt not resolved}"
          : "${REVIEW_STANDARDS:?standards not resolved}"
          : "${REVIEW_CONTEXT:?context not built}"
          : "${REVIEW_OUTPUT:?output path not set}"
          opencode run --auto \
            --model "$FORGE_MODEL" \
            --title "PR review #${{ github.event.pull_request.number }}" \
            --file "$REVIEW_PROMPT" \
            "Review the pull request per the attached prompt file. Context: $REVIEW_CONTEXT. Standards: $REVIEW_STANDARDS. Write findings to: $REVIEW_OUTPUT."

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -s "$REVIEW_OUTPUT" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$REVIEW_OUTPUT"
          else
            echo "::error::agent produced no review output."
            exit 1
          fi

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            .forge-review.md
            .forge-review-context.md
          if-no-files-found: ignore
          retention-days: 14
