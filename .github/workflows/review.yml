name: Forge PR review (reusable)

# Consumers do NOT copy this file. They add a thin wrapper
# `.github/workflows/review.yml` that calls it (see docs/INSTALL.md).
# Read-only by design: the agent reviews and comments, never pushes.
# Posting the comment is the only write, via the caller's gh_token.

on:
  workflow_call:
    inputs:
      model:
        description: "OpenCode model ID"
        required: false
        default: "opencode-go/claude-haiku-5-5"
        type: string
      fallback_model:
        description: "Retry model when the primary fails (budget, retirement, transient)"
        required: false
        default: "opencode/deepseek-v4.1-flash-free"
        type: string
      standards_file:
        description: "Reviewer standards file in the consumer repo"
        required: false
        default: ".sandcastle/CODING_STANDARDS.md"
        type: string
      prompt_file:
        description: "Review prompt (vendored with the runner)"
        required: false
        default: ".forge/prompts/pr-review-prompt.md"
        type: string
      node_version:
        description: "Node version for the runner (review itself needs Node; your repo can be any stack)"
        required: false
        default: "24"
        type: string
      opencode_version:
        description: "Pinned opencode-ai CLI version (never floats; bump deliberately)"
        required: false
        default: "1.18.34"
        type: string
    secrets:
      opencode_api_key:
        description: "OpenCode API key for the review run"
        required: true
      gh_token:
        description: "GitHub token (used only to read the PR and post the review comment — GITHUB_TOKEN suffices)"
        required: true

jobs:
  review:
    name: review (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENCODE_API_KEY: ${{ secrets.opencode_api_key }}
      # Deliberately NO GH_TOKEN here: the agent must not call the GitHub
      # API (prompt-injection via PR title/body/diff stays inert).
      # Same trust posture as the factory: full tool approval, but this
      # workflow has no push/delivery step, so a misbehaving run can only
      # waste minutes, never land code.
      OPENCODE_PERMISSION: '{"*": "allow"}'
      FORGE_MODEL: ${{ inputs.model }}
      FORGE_FALLBACK_MODEL: ${{ inputs.fallback_model }}
      REVIEW_STANDARDS: ${{ inputs.standards_file }}
      REVIEW_PROMPT: ${{ inputs.prompt_file }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.gh_token }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install OpenCode CLI (pinned)
        run: npm install -g opencode-ai@${{ inputs.opencode_version }}

      - name: Build review context
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_STANDARDS_IN: ${{ inputs.standards_file }}
          REVIEW_PROMPT_IN: ${{ inputs.prompt_file }}
        run: |
          # Self-hosting: on benalloway/forge itself there is no vendored
          # .forge/ dir — the script runs from its source home runner/.
          SCRIPT=.forge/build-review-context.sh
          if [ ! -f "$SCRIPT" ] && [ -f runner/build-review-context.sh ]; then
            SCRIPT=runner/build-review-context.sh
          fi
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT missing — consumers re-run bash scripts/sync-forge.sh to re-vendor."
            exit 1
          fi
          bash "$SCRIPT"

      - name: Run PR review agent
        # NOTE: message FIRST, --file LAST. opencode 1.18.34 (yargs array)
        # greedily consumes any positional after --file as an attachment
        # path — verified against the pinned CLI. Any other order fails with
        # `File not found: <the message>`.
        # Primary → fallback: paid primaries fail on exhausted API budgets
        # ("Policy budget exceeded") or retired IDs ("Model not found"); the
        # free fallback keeps the check green while the lineup is fixed in
        # models.json. Both attempts are visible in the step log.
        run: |
          : "${REVIEW_PROMPT:?review prompt not resolved}"
          : "${REVIEW_STANDARDS:?standards not resolved}"
          : "${REVIEW_CONTEXT:?context not built}"
          : "${REVIEW_OUTPUT:?output path not set}"
          : "${FORGE_FALLBACK_MODEL:?fallback model not set}"
          run_review() {
            opencode run --auto \
              --model "$1" \
              --title "PR review #${{ github.event.pull_request.number }}" \
              "Review the pull request per the attached prompt file. Context: $REVIEW_CONTEXT. Standards: $REVIEW_STANDARDS. Write findings to: $REVIEW_OUTPUT." \
              --file "$REVIEW_PROMPT"
          }
          if run_review "$FORGE_MODEL"; then
            echo "Review succeeded with primary model $FORGE_MODEL."
          else
            rc=$?
            echo "::warning::Primary review model $FORGE_MODEL failed (rc=$rc); retrying with fallback $FORGE_FALLBACK_MODEL."
            rm -f "$REVIEW_OUTPUT"
            run_review "$FORGE_FALLBACK_MODEL"
          fi

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -s "$REVIEW_OUTPUT" ]; then
            echo "::error::agent produced no review output."
            exit 1
          fi
          # Upsert: reruns update the previous review comment in place
          # instead of stacking duplicates. Marker is added here (not by
          # the agent) so old outputs without it simply post anew.
          MARKER="<!-- forge-review -->"
          BODY="$(mktemp)"
          { echo "$MARKER"; echo; cat "$REVIEW_OUTPUT"; } > "$BODY"
          EXISTING="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- forge-review -->")) | .id] | last // empty')"
          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING" -X PATCH -F "body=@$BODY"
            echo "Updated review comment $EXISTING."
          else
            gh pr comment "$PR_NUMBER" --body-file "$BODY"
          fi

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            .forge-review.md
            .forge-review-context.md
          if-no-files-found: ignore
          retention-days: 14
